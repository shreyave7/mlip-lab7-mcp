[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-connection-lab"
version = "0.1.0"
description = "A small, synthetic airline MCP teaching lab"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0", "python-dotenv==1.2.1", "tzdata==2025.2"]

[project.optional-dependencies]
live = ["openai==3.35.1"]

[tool.setuptools.packages.find]
include = ["connection_lab*"]

[tool.setuptools.package-data]
connection_lab = ["fixtures.json"]
